name: Build native portable release

on:
  push:
    branches: [rewrite/winui3-portable]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build native app
        run: dotnet build .\native\SandSound\SandSound.csproj -c Release -r win-x64

      - name: Publish complete portable folder
        shell: pwsh
        run: .\scripts\publish-portable.ps1

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path .\artifacts\SandSound-win-x64\* -DestinationPath .\artifacts\SandSound-win-x64.zip -CompressionLevel Optimal

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: SandSound-win-x64
          path: artifacts/SandSound-win-x64.zip
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download portable app
        uses: actions/download-artifact@v4
        with:
          name: SandSound-win-x64

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: SandSound ${{ github.ref_name }}
          generate_release_notes: true
          files: SandSound-win-x64.zip
