name: Build portable SandSound release

on:
  push:
    branches: [main, rewrite/winui3-portable]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    name: Build Windows x64 portable app
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: native/SandSound/SandSound.csproj

      - name: Restore native app
        run: dotnet restore .\native\SandSound\SandSound.csproj --runtime win-x64

      - name: Publish portable app and media tools
        shell: pwsh
        run: .\scripts\publish-portable.ps1

      - name: Verify portable layout
        shell: pwsh
        run: |
          $release = '.\artifacts\SandSound-win-x64'
          $required = @('SandSound.exe', 'Tools\yt-dlp.exe', 'Tools\ffmpeg.exe', 'Tools\ffprobe.exe')
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $release $_)) }
          if ($missing) { throw "Portable release is incomplete: $($missing -join ', ')" }

      - name: Create release archive
        shell: pwsh
        run: |
          $archive = '.\artifacts\SandSound-win-x64.zip'
          if (Test-Path $archive) { Remove-Item -LiteralPath $archive -Force }
          Compress-Archive -Path .\artifacts\SandSound-win-x64\* -DestinationPath $archive -CompressionLevel Optimal
          Get-FileHash $archive -Algorithm SHA256 | Format-List

      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: SandSound-win-x64
          path: artifacts/SandSound-win-x64.zip
          if-no-files-found: error
          retention-days: 30

  macos-build:
    name: Build macOS ${{ matrix.architecture }} portable app
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, x64]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: native/SandSound.Mac/SandSound.Mac.csproj

      - name: Restore macOS app
        run: dotnet restore ./native/SandSound.Mac/SandSound.Mac.csproj --runtime osx-${{ matrix.architecture }}

      - name: Publish portable app and media tools
        run: bash ./scripts/publish-portable-macos.sh --architecture ${{ matrix.architecture }}

      - name: Verify portable layout
        run: |
          release="./artifacts/SandSound-macos-${{ matrix.architecture }}"
          required=(
            "SandSound.app/Contents/Info.plist"
            "SandSound.app/Contents/MacOS/SandSound"
            "SandSound.app/Contents/MacOS/Tools/yt-dlp"
            "SandSound.app/Contents/MacOS/Tools/ffmpeg"
            "SandSound.app/Contents/MacOS/Tools/ffprobe"
            "Data"
            "Downloads"
          )
          for item in "${required[@]}"; do
            test -e "$release/$item" || { echo "Missing $item" >&2; exit 1; }
          done
          expected_arch="${{ matrix.architecture }}"
          if [[ "$expected_arch" == "x64" ]]; then expected_arch="x86_64"; fi
          lipo "$release/SandSound.app/Contents/MacOS/SandSound" -verify_arch "$expected_arch"
          lipo "$release/SandSound.app/Contents/MacOS/Tools/yt-dlp" -verify_arch "$expected_arch"
          lipo "$release/SandSound.app/Contents/MacOS/Tools/ffmpeg" -verify_arch "$expected_arch"
          lipo "$release/SandSound.app/Contents/MacOS/Tools/ffprobe" -verify_arch "$expected_arch"
          codesign --verify --deep --strict "$release/SandSound.app"

      - name: Create release archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "./artifacts/SandSound-macos-${{ matrix.architecture }}" \
            "./artifacts/SandSound-macos-${{ matrix.architecture }}.zip"
          shasum -a 256 "./artifacts/SandSound-macos-${{ matrix.architecture }}.zip"

      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: SandSound-macos-${{ matrix.architecture }}
          path: artifacts/SandSound-macos-${{ matrix.architecture }}.zip
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-build, macos-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download portable archives
        uses: actions/download-artifact@v4
        with:
          pattern: SandSound-*
          path: release
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: SandSound ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.zip
